<!DOCTYPE html>
<html>
<head>
    <title>Test API QEEL</title>
</head>
<body>
    <h1>Test API QEEL</h1>
    <button onclick="testAPI()">Tester l'API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            try {
                console.log('🧪 Test de l\'API QEEL...');
                const response = await fetch('http://localhost:8081/user/online-stats');
                const data = await response.json();
                
                console.log('📦 Réponse complète:', data);
                console.log('📦 Type de response:', typeof data);
                console.log('📦 totalUsers:', data.totalUsers, typeof data.totalUsers);
                console.log('📦 onlineUsers:', data.onlineUsers, typeof data.onlineUsers);
                
                document.getElementById('result').innerHTML = `
                    <h2>Réponse de l'API:</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <h3>Types des champs:</h3>
                    <ul>
                        <li>totalUsers: ${data.totalUsers} (${typeof data.totalUsers})</li>
                        <li>onlineUsers: ${data.onlineUsers} (${typeof data.onlineUsers})</li>
                        <li>totalAdmins: ${data.totalAdmins} (${typeof data.totalAdmins})</li>
                        <li>onlineAdmins: ${data.onlineAdmins} (${typeof data.onlineAdmins})</li>
                        <li>totalRecruiters: ${data.totalRecruiters} (${typeof data.totalRecruiters})</li>
                        <li>onlineRecruiters: ${data.onlineRecruiters} (${typeof data.onlineRecruiters})</li>
                    </ul>
                `;
            } catch (error) {
                console.error('❌ Erreur API:', error);
                document.getElementById('result').innerHTML = `<h2>Erreur: ${error.message}</h2>`;
            }
        }
    </script>
</body>
</html>
