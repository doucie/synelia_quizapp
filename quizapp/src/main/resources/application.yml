spring:
  application:
    name: quizapp
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
      file-size-threshold: 2KB
  cloud:
    consul:
      host: localhost
      port: 8500
      config:
        enabled: true
        profile-separator: '-'
        format: properties
      discovery:
        hostname: to.be.defined
        healthCheckUrl: to.be.defined

app:
  upload:
    dir: uploads/cv
feign:
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 120000
