<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Radar de couverture fonctionnelle</title>
<link rel="stylesheet" href="styles.css">
<style>
  .radar-wrap { display:flex; justify-content:center; margin:20px 0; }
  .radar-legend { display:flex; gap:24px; justify-content:center; margin-top:8px; font-size:12px; }
  .radar-legend .leg { display:flex; align-items:center; gap:6px; }
  .radar-legend .leg .swatch { width:16px; height:3px; border-radius:2px; }</style>

</head>
<body class="mcd-modern">
<div class="page">
<header class="page-header">
  <div><h1>Radar de couverture fonctionnelle</h1><p class="subtitle">Attendu (cible) vs Réalisé (MVP) sur les 6 axes métier de SyneliaQuizApp</p></div>
</header>
<div class="figure">
<div class="canvas" style="width:680px; height:560px; margin:0 auto;">

<div class="radar-wrap">
<svg viewBox="0 0 500 460" width="500" height="460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .axis { stroke: #cbd5e1; stroke-width:0.8; }
      .axis-label { font-family:"Inter","Segoe UI",sans-serif; font-size:11px; fill:#475569; }
      .ring { fill:none; stroke:#e2e8f0; stroke-width:0.6; }
      .ring.label { font-size:9px; fill:#94a3b8; }
    
  </defs>
  <!-- Centre: 250,230 -->
  <!-- Axes: 6 axes at 0°, 60°, 120°, 180°, 240°, 300° from top -->
  <!-- Radius per level: 35px (5 levels = 175px max) -->
  
  <!-- Rings -->
  <circle cx="250" cy="230" r="35" class="ring"/>
  <circle cx="250" cy="230" r="70" class="ring"/>
  <circle cx="250" cy="230" r="105" class="ring"/>
  <circle cx="250" cy="230" r="140" class="ring"/>
  <circle cx="250" cy="230" r="175" class="ring"/>
  <text x="250" y="58" text-anchor="middle" class="ring label">5</text>
  <text x="250" y="93" text-anchor="middle" class="ring label">4</text>
  <text x="250" y="128" text-anchor="middle" class="ring label">3</text>
  <text x="250" y="163" text-anchor="middle" class="ring label">2</text>
  <text x="250" y="198" text-anchor="middle" class="ring label">1</text>

  <!-- Axes: angles from top (negative Y), 60° increments -->
  <!-- Axis 0: Campagnes (top, -90°) -->  <!-- Actually let me use standard: 0°=right, going counter-clockwise for radar -->
  <!-- 6 axes: 90°, 30°, -30°, -90°, -150°, 150° from top -->
  <!-- Or simpler: start from top going clockwise: top, top-right, bottom-right, bottom, bottom-left, top-left -->
  
  <!-- Axis 1: Campagnes (top, 0° from top = -90° in standard SVG) -->
  <line x1="250" y1="230" x2="250" y2="55" class="axis"/>
  <text x="250" y="42" text-anchor="middle" class="axis-label" font-weight="700">Campagnes</text>
  
  <!-- Axis 2: Candidatures (top-right, 60° from top) -->
  <line x1="250" y1="230" x2="402" y2="142" class="axis"/>
  <text x="418" y="140" class="axis-label" font-weight="700">Candidatures</text>
  
  <!-- Axis 3: Quiz (bottom-right, 120° from top) -->
  <line x1="250" y1="230" x2="402" y2="318" class="axis"/>
  <text x="418" y="324" class="axis-label" font-weight="700">Quiz</text>
  
  <!-- Axis 4: Entretiens (bottom, 180° from top) -->
  <line x1="250" y1="230" x2="250" y2="405" class="axis"/>
  <text x="250" y="422" text-anchor="middle" class="axis-label" font-weight="700">Entretiens</text>
  
  <!-- Axis 5: Évaluations (bottom-left, 240° from top) -->
  <line x1="250" y1="230" x2="98" y2="318" class="axis"/>
  <text x="60" y="324" text-anchor="end" class="axis-label" font-weight="700">Évaluations</text>
  
  <!-- Axis 6: Administration (top-left, 300° from top) -->
  <line x1="250" y1="230" x2="98" y2="142" class="axis"/>
  <text x="62" y="140" text-anchor="end" class="axis-label" font-weight="700">Administration</text>

  <!-- Réalisé (solid, orange) - MVP scores: 5,4,4,5,4,3 -->
  <!-- Campagnes: 5*35=175 → 250,55 -->
  <!-- Candidatures: 4*35=140 → 250+140*sin(60°)=250+121=371, 230-140*cos(60°)=230-70=160 -->
  <!-- Quiz: 4*35=140 → 250+140*sin(120°)=250+121=371, 230-140*cos(120°)=230+70=300 -->
  <!-- Entretiens: 5*35=175 → 250, 230+175=405 -->
  <!-- Évaluations: 4*35=140 → 250-121=129, 230+70=300 -->
  <!-- Administration: 3*35=105 → 250-105*sin(60°)=250-91=159, 230-105*cos(60°)=230-53=177 -->
  <polygon points="250,55 371,160 371,300 250,405 129,300 159,177" fill="rgba(245,158,11,.15)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray=""/>
  
  <!-- Attendu (dashed, blue) - Target: 5,5,5,5,5,5 -->
  <polygon points="250,55 402,142 402,318 250,405 98,318 98,142" fill="rgba(14,165,233,.08)" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- Points réalisés -->
  <circle cx="250" cy="55" r="5" fill="#f59e0b"/>
  <circle cx="371" cy="160" r="5" fill="#f59e0b"/>
  <circle cx="371" cy="300" r="5" fill="#f59e0b"/>
  <circle cx="250" cy="405" r="5" fill="#f59e0b"/>
  <circle cx="129" cy="300" r="5" fill="#f59e0b"/>
  <circle cx="159" cy="177" r="5" fill="#f59e0b"/>
</svg>
</div>

<div class="radar-legend">
  <div class="leg"><span class="swatch" style="background:#0ea5e9;"></span> Attendu (cible V1)</div>
  <div class="leg"><span class="swatch" style="background:#f59e0b;"></span> Réalisé (MVP)</div>
</div>

</div>
</div>
<p class="figure-caption">Figure — Radar de couverture fonctionnelle : comparaison entre la cible attendue et le MVP réalisé sur les 6 axes métier (échelle 1–5).</p>
</div>
</div>
<script src="links.js"></script>

</body>
</html>
