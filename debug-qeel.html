<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug QEEL</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f8f9fa; padding: 10px; margin: 5px 0; border-radius: 4px; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🔍 Debug QEEL - Test de chargement</h1>
    <button onclick="testEndpoint()">Test Direct de l'Endpoint</button>
    <button onclick="testWebSocket()">Test WebSocket</button>
    <button onclick="clearLogs()">Effacer</button>
    
    <div id="logs"></div>

    <script>
        function addLog(message, type = 'info') {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong> - ${message}`;
            logs.appendChild(div);
            console.log(message);
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        async function testEndpoint() {
            addLog('🔄 Test de l\'endpoint HTTP...', 'info');
            
            try {
                const response = await fetch('http://localhost:8081/api/qeel/stats', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    mode: 'cors'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                addLog(`✅ Endpoint fonctionne: ${JSON.stringify(data)}`, 'success');
                
            } catch (error) {
                addLog(`❌ Erreur endpoint: ${error.message}`, 'error');
            }
        }

        function testWebSocket() {
            addLog('🔄 Test de la connexion WebSocket...', 'info');
            
            try {
                const socket = new WebSocket('ws://localhost:8081/api/qeel/websocket');
                
                socket.onopen = () => {
                    addLog('✅ WebSocket connecté', 'success');
                };
                
                socket.onmessage = (event) => {
                    addLog(`📩 Message WebSocket reçu: ${event.data}`, 'success');
                };
                
                socket.onerror = (error) => {
                    addLog(`❌ Erreur WebSocket: ${error}`, 'error');
                };
                
                socket.onclose = (event) => {
                    addLog(`📪 WebSocket fermé: ${event.code} - ${event.reason}`, 'info');
                };
                
                // Fermer la connexion après 10 secondes pour le test
                setTimeout(() => {
                    if (socket.readyState === WebSocket.OPEN) {
                        socket.close();
                        addLog('🔒 Test WebSocket terminé', 'info');
                    }
                }, 10000);
                
            } catch (error) {
                addLog(`❌ Erreur initialisation WebSocket: ${error.message}`, 'error');
            }
        }

        // Test automatique au chargement
        addLog('🚀 Page de debug chargée', 'info');
        setTimeout(testEndpoint, 1000);
    </script>
</body>
</html>
