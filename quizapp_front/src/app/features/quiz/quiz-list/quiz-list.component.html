<div class="quiz-list">
  <h2>Available Quizzes</h2>
  <div class="quiz-grid">
    <div 
      *ngFor="let quiz of quizzes$ | async" 
      class="quiz-card"
      [routerLink]="['/quiz', quiz.id]">
      <h3>{{ quiz.title }}</h3>
      <p>{{ quiz.description }}</p>
      <div class="quiz-meta">
        <span>Duration: {{ quiz.duration }}min</span>
        <span>Questions: {{ quiz.questions.length }}</span>
      </div>
    </div>
  </div>
</div>
