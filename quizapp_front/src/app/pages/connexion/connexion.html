<div class="connexion">
  <div class="connexion__container">
    <div class="connexion__header">
      <h1 class="connexion__title">Connexion Personnel</h1>
      <p class="connexion__subtitle">Accès réservé au personnel de Synelia</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="connexion__form">
      <!-- Message d'information (session expirée) -->
      <div class="connexion__info" *ngIf="info$ | async">
        {{ info$ | async }}
      </div>

      <div class="connexion__field">
        <label for="email" class="connexion__label">Email ou nom d'utilisateur</label>
        <input 
          type="text" 
          id="email" 
          formControlName="email"
          class="connexion__input"
          [class.connexion__input--error]="getFieldError('email')"
          placeholder="votre.nom&#64;synelia.com ou votre username">
        <div class="connexion__error" *ngIf="getFieldError('email')">
          {{ getFieldError('email') }}
        </div>
      </div>

      <div class="connexion__field">
        <label for="password" class="connexion__label">Mot de passe</label>
        <div class="connexion__input-wrapper" [class.connexion__input-wrapper--error]="getFieldError('password')">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            formControlName="password"
            class="connexion__input connexion__input--has-toggle"
            placeholder="••••••••">
          <button 
            type="button" 
            class="connexion__toggle-password"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <div class="connexion__error" *ngIf="getFieldError('password')">
          {{ getFieldError('password') }}
        </div>
      </div>

      <div class="connexion__error connexion__error--global" *ngIf="error$ | async">
        {{ error$ | async }}
      </div>

      <button 
        type="submit" 
        class="connexion__submit"
        [disabled]="loading$ | async">
        <span *ngIf="!(loading$ | async)">Se connecter</span>
        <span *ngIf="loading$ | async">Connexion en cours...</span>
      </button>
    </form>

    <div class="connexion__links">
      <a routerLink="/inscription" class="connexion__link">
        Vous avez un code d'invitation ? Créer un compte
      </a>
      <a routerLink="/mot-de-passe-oublie" class="connexion__link">
        Mot de passe oublié ?
      </a>
    </div>

    <div class="connexion__footer">
      <a routerLink="/" class="connexion__home-link">
        ← Retour à l'accueil
      </a>
    </div>
  </div>
</div>
