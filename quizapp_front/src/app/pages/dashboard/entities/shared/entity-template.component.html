<div class="entities-container" [ngClass]="pageClass">
    <!-- ==================
     Header
     ================== -->
    <div class="page-header">
        <div class="breadcrumb" *ngIf="showBreadcrumb">
            <button class="btn-back" (click)="goBack()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 19L5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Retour aux Entités
            </button>
            <span class="breadcrumb-separator">/</span>
            <span class="current-page">{{ breadcrumbCurrent }}</span>
        </div>
        <h1>{{ headerTitle }}</h1>
        <p class="page-description">{{ headerDescription }}</p>
    </div>

    <!-- ==================
     Barre d'outils
     ================== -->
    <div class="toolbar" *ngIf="showToolbar">
        <div class="toolbar-left">
            <input
                *ngIf="showQuickSearch"
                type="text"
                class="search-input"
                placeholder="{{ quickSearchPlaceholder }}"
                [(ngModel)]="quickSearch"
                (input)="onQuickSearch($event.target.value)"
            />

            <!-- Checkbox pour afficher les éléments supprimés -->
            <div class="checkbox-container" *ngIf="showDeletedToggle">
                <input
                    type="checkbox"
                    id="showDeleted"
                    class="checkbox-input"
                    [checked]="showDeletedUsers"
                    (click)="onToggleDeleted()"
                />
                <label for="showDeleted" class="checkbox-label">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 12L11 14L15 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    {{ deletedToggleLabel }}
                </label>
            </div>
        </div>

        <div class="toolbar-right">
            <button
                *ngIf="showAdvancedSearchButton"
                class="btn-secondary-pro"
                (click)="onOpenAdvancedSearch()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 6H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M7 12H17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M10 18H14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                {{ advancedSearchButtonLabel }}
            </button>
            <button
                *ngIf="showCreateButton"
                class="btn-primary-pro"
                (click)="onCreateItem()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 5V19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                {{ createButtonLabel }}
            </button>
        </div>
    </div>


    <!-- ==================
     ADVANCED SEARCH PANEL
     ================== -->
    <div class="advanced-search-panel" *ngIf="showAdvancedSearch">
    <div class="panel-header">
      <h3>Filtres avancés</h3>
      <button class="btn-close" (click)="onAdvancedSearchToggle()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    
    <div class="panel-content">
      <div class="form-grid">
        <!-- Boucle dynamique sur les champs configurés -->
        <ng-container *ngFor="let field of advancedSearchFields">
            
            <!-- Champ texte/email -->
            <div class="form-group" *ngIf="field.type === 'text' || field.type === 'email'">
                <label>{{ field.label }}</label>
                <input 
                    [type]="field.type"
                    class="form-input"
                    [(ngModel)]="advancedSearchCriteria[field.key]"
                    [placeholder]="field.placeholder || ''"
                    [required]="field.required || false"
                />
            </div>
        
            <!-- Champ select -->
            <div class="form-group" *ngIf="field.type === 'select'">
                <label>{{ field.label }}</label>
                <select class="form-select" [(ngModel)]="advancedSearchCriteria[field.key]">
                    <option [ngValue]="undefined">{{ field.placeholder || 'Tous' }}</option>
                    <option *ngFor="let option of field.options" [ngValue]="option.value">
                    {{ option.label }}
                    </option>
                </select>
            </div>
        
            <!-- Champ date -->
            <div class="form-group" *ngIf="field.type === 'date'">
                <label>{{ field.label }}</label>
                <input 
                    type="date"
                    class="form-input"
                    [(ngModel)]="advancedSearchCriteria[field.key]"
                />
            </div>
        
            <!-- Champ range (deux inputs) -->
            <div class="form-row-full" *ngIf="field.type === 'range'">
                <div class="form-group-inline">
                    <label>{{ field.label }} de</label>
                    <input 
                        type="text"
                        class="form-input-inline"
                        [(ngModel)]="advancedSearchCriteria[field.key + 'De']"
                        [placeholder]="field.placeholder || 'Min'"
                    />
                </div>
                <span class="range-separator">à</span>
                <div class="form-group-inline">
                    <input 
                        type="text"
                        class="form-input-inline"
                        [(ngModel)]="advancedSearchCriteria[field.key + 'A']"
                        [placeholder]="field.placeholder || 'Max'"
                    />
                </div>
            </div>

        </ng-container>
        
        <div class="panel-actions">
            <button class="btn-secondary-pro" (click)="onAdvancedSearchReset()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 4V10H7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M23 20V14H17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14L18.36 18.36A9 9 0 0 1 3.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Réinitialiser
            </button>
            <button class="btn-primary-pro" (click)="onAdvancedSearchApply()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                    <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Appliquer les filtres
            </button>
        </div>
    </div>


</div>
