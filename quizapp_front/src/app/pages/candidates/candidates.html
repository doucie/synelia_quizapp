<div class="candidates-page">
  <header class="page-header">
    <h1>Gestion des Candidats</h1>
    <p class="page-description">
      Suivez et évaluez les candidats ayant participé aux quiz de recrutement
    </p>
  </header>

  <div class="candidates-filters">
    <div class="search-box">
      <input type="text" placeholder="Rechercher un candidat..." class="search-input">
      <button class="search-btn">🔍</button>
    </div>
    
    <div class="filter-buttons">
      <button class="filter-btn active">Tous</button>
      <button class="filter-btn">En attente</button>
      <button class="filter-btn">Évalués</button>
      <button class="filter-btn">Retenus</button>
    </div>
  </div>

  <div class="candidates-content">
    <div class="candidates-stats">
      <div class="stat-card">
        <div class="stat-value">0</div>
        <div class="stat-label">Total Candidats</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">0</div>
        <div class="stat-label">En cours</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">0</div>
        <div class="stat-label">Terminés</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">0</div>
        <div class="stat-label">Score Moyen</div>
      </div>
    </div>

    <div class="candidates-list">
      <div class="empty-state">
        <div class="empty-icon">👥</div>
        <h3>Aucun candidat pour le moment</h3>
        <p>Les candidats apparaîtront ici une fois qu'ils auront commencé un quiz</p>
      </div>
    </div>
  </div>
</div>
